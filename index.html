<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balance Chart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
  <main class="app">
    <form class="dot-form" id="dotForm">
      <label>
        時計角（時）
        <input id="hourInput" name="hourInput" type="number" min="0" max="12" step="1" placeholder="例: 2" required />
      </label>
      <label>
        時計角（分）
        <input id="minuteInput" name="minuteInput" type="number" min="0" max="59" step="1" placeholder="例: 35" required />
      </label>
      <label>
        数値
        <input id="valueInput" name="valueInput" type="number" min="0" max="1" step="0.01" inputmode="decimal" placeholder="例: 0.50" required />
      </label>
      <label>
        色
        <select id="dotColor" name="dotColor">
          <option value="red">赤</option>
          <option value="blue">青</option>
        </select>
      </label>
      <button id="addDotButton" type="submit">ドットを追加</button>
      <p id="dotMessage" class="dot-message" aria-live="polite"></p>
    </form>

    <ul id="dotList" class="dot-list" aria-label="追加したドット"></ul>
    <div class="chart-wrap">
      <object data="chart.svg" type="image/svg+xml" aria-label="バランスチャート"></object>
      <svg id="dotOverlay" viewBox="0 0 794 1123" aria-hidden="true"></svg>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
