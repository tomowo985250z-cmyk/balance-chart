<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balance Chart</title>
    <link rel="stylesheet" href="style.css?v=20260902-9" />
  </head>
  <body>
  <main class="app">
    <form class="dot-form" id="dotForm">
      <fieldset class="dot-set dot-set-red">
        <legend>HOV</legend>
        <label>数値<input id="redValueInput" type="number" min="0" step="0.01" inputmode="decimal" /></label>
        <label class="clock-angle">時計角<span><select id="redHourInput" aria-label="赤の時"></select><select id="redMinuteInput" aria-label="赤の分"></select></span></label>
      </fieldset>
      <fieldset class="dot-set dot-set-blue">
        <legend>巡航</legend>
        <label>数値<input id="blueValueInput" type="number" min="0" step="0.01" inputmode="decimal" /></label>
        <label class="clock-angle">時計角<span><select id="blueHourInput" aria-label="青の時"></select><select id="blueMinuteInput" aria-label="青の分"></select></span></label>
      </fieldset>
      <button id="addDotButton" type="submit">ドットを追加</button>
      <p id="dotMessage" class="dot-message" aria-live="polite"></p>
    </form>

    <ul id="dotList" class="dot-list" aria-label="追加したドット"></ul>
    <div class="chart-wrap">
      <object data="chart.svg?v=20260902-12" type="image/svg+xml" aria-label="バランスチャート"></object>
      <svg id="dotOverlay" viewBox="0 0 794 1123" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <label class="rotation-lock">
        <input id="rotationLock" type="checkbox" role="switch" />
        <span class="rotation-lock-track" aria-hidden="true"></span>
        回転ロック
      </label>
    </div>

    <div id="timePicker" class="time-picker" hidden>
      <div class="time-picker-panel" role="dialog" aria-modal="true" aria-labelledby="timePickerTitle">
        <p id="timePickerTitle" class="time-picker-title">時間：分を選択</p>
        <div class="time-wheels" aria-label="時間と分を選択">
          <div class="time-wheel-window"><div id="hourWheel" class="time-wheel" role="listbox" aria-label="時間"></div></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-wheel-window"><div id="minuteWheel" class="time-wheel" role="listbox" aria-label="分"></div></div>
        </div>
        <div class="time-picker-actions">
          <button id="closeTimePicker" type="button">キャンセル</button>
          <button id="confirmTimePicker" type="button">決定</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js?v=20260903-17"></script>
</body>
</html>
