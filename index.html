<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balance Chart</title>
    <link rel="stylesheet" href="style.css?v=20260920-forecast-notice" />
  </head>
  <body>
  <main class="app">
    <form class="dot-form" id="dotForm">
      <fieldset class="dot-set dot-set-red">
        <legend>HOV</legend>
        <label>数値<input id="redValueInput" type="number" min="0" step="0.01" inputmode="decimal" /></label>
        <label class="clock-angle">時計角<span><select id="redHourInput" aria-label="赤の時"></select><select id="redMinuteInput" aria-label="赤の分"></select></span></label>
      </fieldset>
      <fieldset class="dot-set dot-set-blue">
        <legend>巡航</legend>
        <label>数値<input id="blueValueInput" type="number" min="0" step="0.01" inputmode="decimal" /></label>
        <label class="clock-angle">時計角<span><select id="blueHourInput" aria-label="青の時"></select><select id="blueMinuteInput" aria-label="青の分"></select></span></label>
      </fieldset>
      <button id="addDotButton" type="submit">ドットを追加</button>
      <button id="cancelResultEdit" type="button" hidden>編集をキャンセル</button>
      <p id="resultEditMessage" class="edit-message" aria-live="polite" hidden></p>
      <button id="cancelCruiseAddition" type="button" hidden>巡航追加をキャンセル</button>
      <p id="cruiseAdditionMessage" class="dot-message" aria-live="polite" hidden></p>
      <p id="dotMessage" class="dot-message" aria-live="polite"></p>
    </form>

    <form class="adjustment-form" id="adjustmentForm">
      <fieldset class="memo-set">
        <legend>調整量</legend>
        <button class="memo-wheel-trigger" id="memoOne" type="button">選択</button>
        <button class="memo-wheel-trigger" id="memoTwo" type="button">選択</button>
        <button class="memo-wheel-trigger" id="memoThree" type="button" disabled>選択</button>
        <button class="memo-wheel-trigger" id="memoFour" type="button">選択</button>
      </fieldset>
      <select id="adjustmentTarget" aria-label="調整量の追加先" disabled>
        <option>結果なし</option>
      </select>
      <button id="addAdjustmentButton" type="submit">調整量を追加</button>
      <label class="actual-adjustment"><input id="actualAdjustment" type="checkbox" />実調整として記録（次の測定を学習）</label>
      <button id="cancelAdjustmentEdit" type="button" hidden>編集をキャンセル</button>
      <p id="adjustmentEditMessage" class="edit-message" aria-live="polite" hidden></p>
      <p id="adjustmentMessage" class="dot-message" aria-live="polite"></p>
      <p id="forecastLearningNotice" class="forecast-learning-notice" aria-live="polite" hidden></p>
    </form>

    <h2 id="resultsHeading" class="results-heading">結果</h2>
    <ul id="dotList" class="dot-list" aria-labelledby="resultsHeading"></ul>
    <div class="chart-navigation" aria-label="チャート画面">
      <h2 id="chartTitle">現在の調整：ピッチリンク</h2>
      <p class="chart-swipe-hint">← 左右にスワイプして切替 →</p>
      <div class="chart-pages" aria-label="ページ切替">
        <button type="button" class="chart-page is-active" data-page="0" aria-label="ピッチリンク用を表示" aria-current="page"></button>
        <button type="button" class="chart-page" data-page="1" aria-label="トリムタブ用を表示"></button>
      </div>
      <button id="resetLearning" class="learning-reset" type="button">自動補正の学習値をリセット</button>
    </div>
    <div class="chart-wrap">
      <object data="chart.svg?v=20260915-pitch-auto" type="image/svg+xml" aria-label="バランスチャート"></object>
      <svg id="dotOverlay" viewBox="0 0 794 1123" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <button id="guideToggle" class="rotation-lock guide-toggle" type="button" aria-pressed="false">
        <span class="rotation-lock-track" aria-hidden="true"></span>
        <span id="guideToggleText">ガイド OFF</span>
      </button>
      <button id="pitchModeToggle" class="rotation-lock trim-mode-toggle pitch-mode-toggle" type="button" aria-pressed="false" hidden>赤・青六角形：手動</button>
      <button id="trimModeToggle" class="rotation-lock trim-mode-toggle" type="button" aria-pressed="false" hidden>紫六角形：手動</button>
      <label class="rotation-lock">
        <input id="rotationLock" type="checkbox" role="switch" />
        <span class="rotation-lock-track" aria-hidden="true"></span>
        回転ロック
      </label>
    </div>

    <div id="timePicker" class="time-picker" hidden>
      <div class="time-picker-panel" role="dialog" aria-modal="true" aria-labelledby="timePickerTitle">
        <p id="timePickerTitle" class="time-picker-title">時間：分を選択</p>
        <div class="time-wheels" aria-label="時間と分を選択">
          <div class="time-wheel-window"><div id="hourWheel" class="time-wheel" role="listbox" aria-label="時間"></div></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-wheel-window"><div id="minuteWheel" class="time-wheel" role="listbox" aria-label="分"></div></div>
        </div>
        <div class="time-picker-actions">
          <button id="closeTimePicker" type="button">キャンセル</button>
          <button id="confirmTimePicker" type="button">決定</button>
        </div>
      </div>
    </div>

    <div id="memoPicker" class="time-picker" hidden>
      <div class="time-picker-panel" role="dialog" aria-modal="true" aria-labelledby="memoPickerTitle">
        <p id="memoPickerTitle" class="time-picker-title">調整量を選択</p>
        <div class="memo-wheel-window"><div id="memoWheel" class="time-wheel" role="listbox" aria-label="調整量の選択肢"></div></div>
        <div class="time-picker-actions">
          <button id="closeMemoPicker" type="button">キャンセル</button>
          <button id="confirmMemoPicker" type="button">決定</button>
        </div>
      </div>
    </div>
  </main>

  <dialog id="deleteConfirmation" class="delete-confirmation" aria-labelledby="deleteConfirmationTitle">
    <form method="dialog">
      <p id="deleteConfirmationTitle"></p>
      <div class="delete-confirmation-actions">
        <button type="submit" value="cancel" autofocus>キャンセル</button>
        <button type="submit" value="delete" class="confirm-delete-button">削除する</button>
      </div>
    </form>
  </dialog>
  <dialog id="editConfirmation" class="delete-confirmation" aria-labelledby="editConfirmationTitle">
    <form method="dialog">
      <p id="editConfirmationTitle"></p>
      <div class="delete-confirmation-actions">
        <button type="submit" value="cancel" autofocus>キャンセル</button>
        <button type="submit" value="edit" class="confirm-delete-button">編集する</button>
      </div>
    </form>
  </dialog>
  <script src="learning.js?v=20260915-recent-confirmed"></script>
  <script src="app.js?v=20260920-forecast-notice"></script>
</body>
</html>
