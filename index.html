<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balance Chart</title>
    <link rel="stylesheet" href="style.css?v=20260902-2" />
  </head>
  <body>
  <main class="app">
    <form class="dot-form" id="dotForm">
      <fieldset class="dot-set dot-set-red">
        <legend>赤</legend>
        <label>時<select id="redHourInput" aria-label="赤の時"></select></label>
        <label>分<select id="redMinuteInput" aria-label="赤の分"></select></label>
        <label>数値<input id="redValueInput" type="number" min="0" max="1" step="0.01" inputmode="decimal" /></label>
      </fieldset>
      <fieldset class="dot-set dot-set-blue">
        <legend>青</legend>
        <label>時<select id="blueHourInput" aria-label="青の時"></select></label>
        <label>分<select id="blueMinuteInput" aria-label="青の分"></select></label>
        <label>数値<input id="blueValueInput" type="number" min="0" max="1" step="0.01" inputmode="decimal" /></label>
      </fieldset>
      <button id="addDotButton" type="submit">ドットを追加</button>
      <p id="dotMessage" class="dot-message" aria-live="polite"></p>
    </form>

    <ul id="dotList" class="dot-list" aria-label="追加したドット"></ul>
    <div class="chart-wrap">
      <object data="chart.svg?v=20260902-2" type="image/svg+xml" aria-label="バランスチャート"></object>
      <svg id="dotOverlay" viewBox="0 0 794 1123" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <label class="rotation-lock">
        <input id="rotationLock" type="checkbox" role="switch" />
        <span class="rotation-lock-track" aria-hidden="true"></span>
        回転ロック
      </label>
    </div>

    <div id="timePicker" class="time-picker" hidden>
      <div class="time-picker-panel" role="dialog" aria-modal="true" aria-labelledby="timePickerTitle">
        <p id="timePickerTitle" class="time-picker-title">時刻を選択</p>
        <div class="time-wheel-window">
          <div id="timeWheel" class="time-wheel" role="listbox"></div>
        </div>
        <button id="closeTimePicker" type="button">閉じる</button>
      </div>
    </div>
  </main>

  <script src="app.js?v=20260902-2"></script>
</body>
</html>
