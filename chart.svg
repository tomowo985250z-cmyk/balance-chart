  <script><![CDATA[
    (() => {
      const svg = document.documentElement;
      const centerX = 397;
      const centerY = 520;
      const angles = { hov: 0, cruise: 0 };
      let active = null;

      svg.style.touchAction = 'none';

      function pointerAngle(event) {
        const point = svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        const position = point.matrixTransform(svg.getScreenCTM().inverse());
        return Math.atan2(position.y - centerY, position.x - centerX) * 180 / Math.PI;
      }

      svg.addEventListener('pointerdown', (event) => {
        if (svg.dataset.rotationLocked === 'true') return;
        const target = event.target;
        const group = target.closest('#hovGroup, #cruiseGroup');
        if (!group) return;

        const name = group.id === 'hovGroup' ? 'hov' : 'cruise';
        active = { group, name, pointerId: event.pointerId, startAngle: pointerAngle(event), groupAngle: angles[name] };
        svg.setPointerCapture(event.pointerId);
        group.style.cursor = 'grabbing';
        event.preventDefault();
      });

      svg.addEventListener('pointermove', (event) => {
        if (!active || event.pointerId !== active.pointerId) return;
        if (svg.dataset.rotationLocked === 'true') {
          stopRotation(event);
          return;
        }
        const angle = active.groupAngle + pointerAngle(event) - active.startAngle;
        angles[active.name] = angle;
        active.group.setAttribute('transform', `rotate(${angle} ${centerX} ${centerY})`);
        event.preventDefault();
      });

      function stopRotation(event) {
        if (!active || event.pointerId !== active.pointerId) return;
        if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
        active.group.style.cursor = 'grab';
        active = null;
      }

      svg.addEventListener('pointerup', stopRotation);
      svg.addEventListener('pointercancel', stopRotation);
    })();
  ]]></script>
</svg>






































